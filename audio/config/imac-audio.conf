# Apple iMac16,2 — Cirrus Logic CS4208
#
# power_save=0: the codec's resume path never re-enables the speaker amplifier,
# so if it is allowed to suspend the speakers go silent until the next reboot.
#
# model=mbp11: pin the CS4208_MBP11 fixup (no pin rewrite, just GPIO0 + S/PDIF
# hook — the same fixup upstream assigns to the iMac 16,1). This makes the
# driver ignore its quirk tables. It matters because the Omarchy kernel's
# 0512-sound-fixes.patch adds a "MacBookAir 7,2" quirk keyed on PCI SSID
# 8086:7270, which is Intel's GENERIC HDA subsystem ID and matches this iMac
# too; that applies the MacBook Air pin table, which disables the pins that
# drive the iMac's speakers. The option is given for both HDA controllers
# (HDMI, PCH) so it is robust to probe order; the HDMI codec ignores it.
options snd_hda_intel power_save=0 model=mbp11,mbp11
