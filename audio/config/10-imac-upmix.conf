# iMac16,2 speakers: the 4-ch device is FL,RL,FR,RR where RL/RR are the woofers.
# Force a plain front->rear copy so each side drives both its drivers. The default
# upmix method (psd) sends a difference signal to the rear, which puts side-channel
# information into the woofers instead of the music and sounds thin.
stream.properties = {
    channelmix.upmix        = true
    channelmix.upmix-method = simple
    channelmix.lfe-cutoff   = 0
}
