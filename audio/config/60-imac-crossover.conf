# iMac16,2 built-in speakers: software bi-amp crossover.
#
# The CS4208's 4-channel PCM drives each speaker's two drivers separately:
#   slot 0 = LEFT tweeter   slot 1 = LEFT woofer
#   slot 2 = RIGHT tweeter  slot 3 = RIGHT woofer
# (exposed as FL, RL, FR, RR by 51-imac-speakers.conf)
#
# There is no passive crossover in the speakers, so without this every driver
# gets full-range audio: the tweeters try to reproduce bass and the woofers are
# muddied by mids, which sounds thin. This splits the band at 800 Hz and adds a
# little woofer gain, presenting a normal stereo sink to applications.
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "iMac Built-in Speakers"
            media.name       = "iMac Built-in Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = inL label = copy }
                    { type = builtin name = inR label = copy }
                    { type = builtin name = hpL label = bq_highpass control = { Freq = 800 Q = 0.707 } }
                    { type = builtin name = hpR label = bq_highpass control = { Freq = 800 Q = 0.707 } }
                    { type = builtin name = lpL label = bq_lowpass  control = { Freq = 800 Q = 0.707 } }
                    { type = builtin name = lpR label = bq_lowpass  control = { Freq = 800 Q = 0.707 } }
                    { type = builtin name = gL  label = linear      control = { Mult = 2.0 Add = 0.0 } }
                    { type = builtin name = tL  label = linear      control = { Mult = 0.5 Add = 0.0 } }
                    { type = builtin name = gR  label = linear      control = { Mult = 2.0 Add = 0.0 } }
                    { type = builtin name = tR  label = linear      control = { Mult = 0.5 Add = 0.0 } }
                ]
                links = [
                    { output = "inL:Out" input = "hpL:In" }
                    { output = "inL:Out" input = "lpL:In" }
                    { output = "inR:Out" input = "hpR:In" }
                    { output = "inR:Out" input = "lpR:In" }
                    { output = "lpL:Out" input = "gL:In" }
                    { output = "hpL:Out" input = "tL:In" }
                    { output = "lpR:Out" input = "gR:In" }
                    { output = "hpR:Out" input = "tR:In" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "tL:Out" "gL:Out" "tR:Out" "gR:Out" ]
            }
            capture.props = {
                node.name      = "imac_speakers"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "imac_speakers_out"
                audio.channels    = 4
                audio.position    = [ FL RL FR RR ]
                node.target       = "alsa_output.pci-0000_00_1b.0.analog-surround-40"
                stream.dont-remix = true
            }
        }
    }
]
