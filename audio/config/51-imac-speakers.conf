# NOTE: this rule must match ONLY the surround-40 sink. Matching the whole
# card (~alsa_output.pci-0000_00_1b.0.*) also forces the analog-stereo sink
# used for HEADPHONES into 4 channels, which mutes the right ear.
# iMac16,2 (21.5" Late 2015) — built-in speakers, Cirrus Logic CS4208.
# Real wiring of the 4-channel PCM (driver's FL,FR,LFE,LFE chmap is wrong):
#   slot 0 = LEFT tweeter    slot 1 = LEFT woofer
#   slot 2 = RIGHT tweeter   slot 3 = RIGHT woofer
# Declared as FL,RL,FR,RR so stereo can be upmixed front->rear, putting each
# input channel into BOTH of its speaker's drivers.
monitor.alsa.rules = [
  {
    # Pin the card to the 4-channel surround profile. WirePlumber's default policy
    # re-selects a profile when port availability changes, so plugging in headphones
    # made it switch to analog-stereo — which DESTROYS the analog-surround-40 sink
    # that both filter chains target, silencing them. Profile switches also
    # power-cycle the codec pins and can latch a speaker amp channel off until
    # reboot. auto-port stays enabled: the codec must still switch its own output
    # port to the headphone jack.
    matches = [
      { device.name = "alsa_card.pci-0000_00_1b.0" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        # The speakers sit on the codec's DIGITAL pins, which have no amp, so the
        # hardware "Master" control does nothing for them (it only affects the
        # analog headphone path). Without software mixing the volume slider is
        # completely inert on the speakers. This is a DEVICE property - setting it
        # on the node has no effect.
        api.alsa.soft-mixer  = true
        api.acp.auto-port    = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1b.0.analog-surround-40" }
    ]
    actions = {
      update-props = {
        audio.format             = "S16LE"
        audio.rate               = 48000
        audio.channels           = 4
        audio.position           = [ FL, RL, FR, RR ]
        api.alsa.use-chmap       = false
        node.description         = "Built-in Speakers (raw - no crossover)"
        node.nick                = "Built-in Speakers (raw)"
        channelmix.upmix         = true
        channelmix.upmix-method  = simple
      }
    }
  }
  {
    # Friendly names in the output menu. The headphone path is the card's raw
    # analog-stereo sink (no filter chain), so without this it shows up as
    # "CS4208 Analog". Descriptions only — node names are unchanged, so the
    # switcher and the crossover's node.target keep working.
    matches = [
      { node.name = "alsa_output.pci-0000_00_1b.0.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "iMac Headphones"
        node.nick        = "iMac Headphones"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_03.0.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Display Audio (DisplayPort)"
        node.nick        = "Display Audio (DisplayPort)"
      }
    }
  }
  {
    # The built-in microphone. Same story as the sinks: the bar shows node.nick,
    # which is the raw ALSA name "CS4208 Analog".
    matches = [
      { node.name = "alsa_input.pci-0000_00_1b.0.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "iMac Built-in Mic"
        node.nick        = "iMac Built-in Mic"
      }
    }
  }
]
